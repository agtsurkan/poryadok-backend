<!DOCTYPE html>
<html>
<head>
<script id="poryadok-api-bridge">
(function () {
  "use strict";
  // ── Порядок · API bridge (P0) ───────────────────────────────────────────
  var LS = window.localStorage;
  var realGet = LS.getItem.bind(LS);
  var realSet = LS.setItem.bind(LS);
  var realRemove = LS.removeItem.bind(LS);
  var DATA_KEY = "poryadok.data";
  var DEFAULT_API = "http://localhost:8000";

  function api() { return (realGet("poryadok.api") || DEFAULT_API).replace(/\/+$/, ""); }
  function token() { return realGet("poryadok.token"); }

  var serverData = null; // server bundle string, served to the app
  var putTimer = null;

  // Reads of poryadok.data come from the server once hydrated.
  LS.getItem = function (k) {
    return (k === DATA_KEY && serverData !== null) ? serverData : realGet(k);
  };
  // Writes of poryadok.data are mirrored to the server (debounced).
  LS.setItem = function (k, v) {
    realSet(k, v);
    if (k === DATA_KEY && token()) {
      serverData = v;
      clearTimeout(putTimer);
      putTimer = setTimeout(function () { putState(v); }, 700);
    }
  };

  function putState(body) {
    fetch(api() + "/state", {
      method: "PUT",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token() },
      body: body
    }).then(function (r) { if (r.status === 401) logout(); })
      .catch(function () { /* offline — kept locally, resyncs on next save */ });
  }

  function logout() { realRemove("poryadok.token"); location.reload(); }

  // Synchronous hydration, so componentDidMount sees server data.
  function hydrate() {
    if (!token()) return "anon";
    try {
      var x = new XMLHttpRequest();
      x.open("GET", api() + "/state", false);
      x.setRequestHeader("Authorization", "Bearer " + token());
      x.send(null);
      if (x.status === 200) { serverData = x.responseText; return "ok"; }
      if (x.status === 401) { realRemove("poryadok.token"); return "anon"; }
      return "error";
    } catch (e) { return "offline"; }
  }

  function loginHTML(apiUrl, message) {
    return ""
      + "<style>"
      + "#poryadok-login{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;"
      + "justify-content:center;background:#E9E4D9;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:#26221C}"
      + "#poryadok-login .card{width:340px;max-width:88vw;background:#FFFCF6;border:1px solid #E7DECB;"
      + "border-radius:18px;padding:28px 26px;box-shadow:0 8px 30px rgba(38,34,28,.10)}"
      + "#poryadok-login h1{font-size:21px;font-weight:600;margin:0 0 4px}"
      + "#poryadok-login p.sub{font-size:13px;color:#6B6457;margin:0 0 18px}"
      + "#poryadok-login label{display:block;font-size:12px;color:#6B6457;margin:14px 0 6px}"
      + "#poryadok-login input{width:100%;padding:11px 13px;border:1px solid #E7DECB;border-radius:11px;"
      + "background:#fff;font-size:15px;color:#26221C;outline:none}"
      + "#poryadok-login input:focus{border-color:#B5763A}"
      + "#poryadok-login button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:11px;"
      + "background:#B5763A;color:#fff;font-size:15px;font-weight:600;cursor:pointer}"
      + "#poryadok-login button:disabled{opacity:.6;cursor:default}"
      + "#poryadok-login .err{color:#B0492F;font-size:13px;min-height:18px;margin-top:10px}"
      + "#poryadok-login details{margin-top:14px}#poryadok-login summary{font-size:12px;color:#9C9483;cursor:pointer}"
      + "</style>"
      + "<form id='pl-form' class='card'>"
      + "<h1>Порядок</h1><p class='sub'>Войдите, чтобы продолжить</p>"
      + "<label>Email</label><input id='pl-email' type='email' autocomplete='username' value='demo@poryadok.app' required>"
      + "<label>Пароль</label><input id='pl-pass' type='password' autocomplete='current-password' required>"
      + "<button id='pl-btn' type='submit'>Войти</button>"
      + "<div class='err' id='pl-err'>" + (message || "") + "</div>"
      + "<details><summary>Сервер</summary><label>Адрес API</label>"
      + "<input id='pl-api' type='text' value='" + apiUrl + "'></details>"
      + "</form>";
  }

  function showLogin(message) {
    function build() {
      if (document.getElementById("poryadok-login")) return;
      var wrap = document.createElement("div");
      wrap.id = "poryadok-login";
      wrap.innerHTML = loginHTML(api(), message);
      document.body.appendChild(wrap);
      document.getElementById("pl-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var err = document.getElementById("pl-err");
        var btn = document.getElementById("pl-btn");
        var base = (document.getElementById("pl-api").value.trim() || DEFAULT_API).replace(/\/+$/, "");
        var email = document.getElementById("pl-email").value.trim();
        var pass = document.getElementById("pl-pass").value;
        err.textContent = ""; btn.disabled = true; btn.textContent = "Вход…";
        fetch(base + "/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: pass })
        }).then(function (r) {
          return r.ok ? r.json() : r.json().then(function (j) { throw new Error(j.detail || "Не вышло войти"); });
        }).then(function (j) {
          realSet("poryadok.api", base);
          realSet("poryadok.token", j.access_token || j.token);
          location.reload();
        }).catch(function (ex) {
          err.textContent = (ex && ex.message) ? ex.message : "Сервер недоступен";
          btn.disabled = false; btn.textContent = "Войти";
        });
      });
    }
    if (document.body) build();
    else document.addEventListener("DOMContentLoaded", build);
  }

  var state = hydrate(); // runs in <head>, before the app boots
  if (state === "anon") showLogin("");
  else if (state === "offline") showLogin("Сервер недоступен — проверь адрес.");
  else if (state === "error") showLogin("Ошибка сервера. Войдите заново.");
  // state === "ok": app boots with server data, no overlay.
})();
</script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

u002Fspan><span style=\"font-size:11.5px; opacity:0.72;\">есть силы<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <h2 style=\"margin:28px 0 16px; font-size:24px; font-weight:700; letter-spacing:-0.02em; color:var(--text);\">Сколько есть времени?<\u002Fh2>\n          <div style=\"display:flex; gap:10px;\">\n            <button onclick=\"{{pick15}}\" class=\"chip\" style=\"{{time15Style}}\">15 мин<\u002Fbutton>\n            <button onclick=\"{{pick30}}\" class=\"chip\" style=\"{{time30Style}}\">30 мин<\u002Fbutton>\n            <button onclick=\"{{pick60}}\" class=\"chip\" style=\"{{time60Style}}\">60 мин<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:20px 2px 0; font-size:13.5px; line-height:1.5; color:var(--text-3);\">{{blockHint}}<\u002Fp>\n          <button onclick=\"{{beginFocus}}\" class=\"npress\" style=\"margin:24px 0 0; height:54px; border:none; border-radius:16px; background:var(--accent); box-shadow:var(--e-raise); color:#fff; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px;\">Начать <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- focus one task -->\n      <sc-if value=\"{{phaseFocus}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"flex:1; overflow:auto; display:flex; flex-direction:column; padding:0 30px 36px; max-width:560px; width:100%; margin:0 auto;\">\n          <div style=\"display:flex; justify-content:center; flex:none;\">\n            <span style=\"display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-2); padding:6px 14px; border-radius:999px; background:var(--surface); box-shadow:var(--e-soft); font-family:'SF Mono',ui-monospace,monospace;\">{{ctx
